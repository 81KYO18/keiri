<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>経理サイト</title>
  <style>
    :root{
      --bg:#020617;--panel:#0f172a;--border:#1f2937;--accent:#38bdf8;
      --accent-soft:rgba(56,189,248,0.12);--danger:#f97373;--text:#e5e7eb;
      --sub:#9ca3af;--income:#4ade80;--expense:#f97373;--radius:12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;padding:20px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
      background:radial-gradient(circle at top,#0f172a 0,#020617 55%,#000 100%);color:var(--text);
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    .wrap{max-width:1200px;margin:0 auto}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .title{font-size:20px;letter-spacing:.06em}
    .panel{
      background:linear-gradient(135deg,rgba(15,23,42,.98),rgba(15,23,42,.9));
      border:1px solid rgba(148,163,184,.12);border-radius:var(--radius);padding:14px;
      box-shadow:0 18px 40px rgba(2,6,23,.6);backdrop-filter:blur(6px);
    }
    .auth-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .auth-panel{flex:1 1 360px}
    .panel-title{font-size:13px;margin-bottom:8px;color:var(--sub);letter-spacing:.06em}
    input,select,button,textarea{font-size:14px}
    input,select,textarea{
      width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);
      background:#020617;color:var(--text);
    }
    .btn-main{padding:10px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--text);cursor:pointer}
    .btn-sub{padding:8px 12px;border-radius:10px;border:1px solid rgba(148,163,184,.18);background:#020617;color:var(--sub);cursor:pointer}
    .auth-msg{margin-top:8px;font-size:13px;color:var(--danger);min-height:20px}
    .muted{font-size:12px;color:var(--sub);margin-top:6px}
    .link{color:var(--accent);text-decoration:underline;cursor:pointer}
    .hidden{display:none!important}
    .center{display:flex;align-items:center;justify-content:center}
    .small{font-size:12px;color:var(--sub)}
    .form-row{display:flex;gap:8px;align-items:center;margin-top:8px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">極密アプリ Ultimate Secure</div>
      <div class="small">安全に管理する家計簿</div>
    </div>

    <div class="auth-row" id="authRow">
      <div class="panel auth-panel" id="signupPanel" aria-labelledby="signupTitle">
        <div class="panel-title" id="signupTitle">新規登録</div>
        <label class="sr-only" for="signupEmail">メールアドレス</label>
        <input id="signupEmail" type="email" placeholder="メールアドレス" autocomplete="email" />
        <label class="sr-only" for="signupPassword">パスワード</label>
        <input id="signupPassword" type="password" placeholder="パスワード（12文字以上推奨）" autocomplete="new-password" />
        <label class="sr-only" for="signupPasswordConfirm">パスワード確認</label>
        <input id="signupPasswordConfirm" type="password" placeholder="パスワード確認" autocomplete="new-password" />
        <div class="form-row">
          <button id="signupBtn" class="btn-main" type="button">新規登録</button>
          <button id="signupClear" class="btn-sub" type="button">クリア</button>
        </div>
        <div id="signupMsg" class="auth-msg" aria-live="polite"></div>
        <div class="muted">パスワードは長さを重視してください。パスワードマネージャ推奨。</div>
      </div>

      <div class="panel auth-panel" id="loginPanel" aria-labelledby="loginTitle">
        <div class="panel-title" id="loginTitle">ログイン</div>
        <label class="sr-only" for="loginEmail">メールアドレス</label>
        <input id="loginEmail" type="email" placeholder="メールアドレス" autocomplete="email" />
        <label class="sr-only" for="loginPassword">パスワード</label>
        <input id="loginPassword" type="password" placeholder="パスワード" autocomplete="current-password" />
        <div class="form-row">
          <button id="loginBtn" class="btn-main" type="button">ログイン</button>
          <button id="loginClear" class="btn-sub" type="button">クリア</button>
        </div>
        <div id="loginMsg" class="auth-msg" aria-live="polite"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
          <a id="forgotLink" class="link" href="#" role="link">IDまたはパスワードを忘れた方はこちら</a>
          <a id="helpLink" class="small" href="#" role="link">ヘルプ</a>
        </div>

        <div id="loginHints" class="muted" style="margin-top:8px">
          <div id="hintWrongField" class="hidden">入力欄を確認してください。</div>
          <div id="hintCheckEmail" class="hidden">メールアドレスが正しいか確認してください。</div>
          <div id="hintCheckPassword" class="hidden">パスワードが正しいか確認してください。</div>
          <div id="hintConfirmEmail" class="hidden">登録後に確認メールが必要です。メールを確認してください。</div>
        </div>
      </div>

    <div id="appArea" class="hidden" aria-hidden="true"></div>

  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // DOM
    const signupEmail = document.getElementById("signupEmail");
    const signupPassword = document.getElementById("signupPassword");
    const signupPasswordConfirm = document.getElementById("signupPasswordConfirm");
    const signupBtn = document.getElementById("signupBtn");
    const signupClear = document.getElementById("signupClear");
    const signupMsg = document.getElementById("signupMsg");

    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginBtn = document.getElementById("loginBtn");
    const loginClear = document.getElementById("loginClear");
    const loginMsg = document.getElementById("loginMsg");

    const forgotLink = document.getElementById("forgotLink");
    const helpLink = document.getElementById("helpLink");

    const hintWrongField = document.getElementById("hintWrongField");
    const hintCheckEmail = document.getElementById("hintCheckEmail");
    const hintCheckPassword = document.getElementById("hintCheckPassword");
    const hintConfirmEmail = document.getElementById("hintConfirmEmail");

    // Supabase client placeholder (replace key in later parts)
    const supabaseUrl = ""; // set in later part
    const supabaseKey = ""; // set in later part
    let supabase = null;

    // Utility: clear hints
    function clearHints() {
      [hintWrongField, hintCheckEmail, hintCheckPassword, hintConfirmEmail].forEach(el => el.classList.add("hidden"));
    }

    // Map auth error to user-friendly hints
    function showLoginErrorHints(err) {
      clearHints();
      if (!err) return;
      const msg = (err.message || "").toLowerCase();
      loginMsg.textContent = err.message || "認証に失敗しました。";
      // common patterns
      if (msg.includes("invalid") || msg.includes("format") || msg.includes("email")) {
        hintCheckEmail.classList.remove("hidden");
      }
      if (msg.includes("password") || msg.includes("invalid login") || msg.includes("invalid credentials")) {
        hintCheckPassword.classList.remove("hidden");
      }
      if (msg.includes("confirm") || msg.includes("email not confirmed") || msg.includes("verification")) {
        hintConfirmEmail.classList.remove("hidden");
      }
      // fallback
      if (!hintCheckEmail.classList.contains("hidden") || !hintCheckPassword.classList.contains("hidden") || !hintConfirmEmail.classList.contains("hidden")) {
        // at least one specific hint shown
      } else {
        hintWrongField.classList.remove("hidden");
      }
    }

    // Prevent double clicks and ensure buttons enabled
    function setButtonState(btn, enabled) {
      btn.disabled = !enabled;
      if (enabled) btn.classList.remove("disabled");
      else btn.classList.add("disabled");
    }

    // Basic client-side password validation for signup
    function validatePasswordClient(pw, confirm) {
      const minLen = 12;
      if (!pw || pw.length < minLen) return { ok:false, msg:`パスワードは最低 ${minLen} 文字必要です` };
      if (pw !== confirm) return { ok:false, msg:"パスワード確認が一致しません" };
      return { ok:true };
    }

    // Attach simple handlers (actual auth functions implemented in later parts)
    signupBtn.addEventListener("click", async () => {
      signupMsg.textContent = "";
      const email = signupEmail.value.trim();
      const pw = signupPassword.value;
      const confirm = signupPasswordConfirm.value;
      const v = validatePasswordClient(pw, confirm);
      if (!v.ok) { signupMsg.textContent = v.msg; return; }
      if (!supabase) {
        signupMsg.textContent = "システム未初期化（後で再試行してください）。";
        return;
      }
      setButtonState(signupBtn, false);
      try {
        const res = await supabase.auth.signUp({ email, password: pw });
        if (res.error) throw res.error;
        signupMsg.textContent = "確認メールを送信しました。メールを確認してください。";
        signupEmail.value = ""; signupPassword.value = ""; signupPasswordConfirm.value = "";
      } catch (err) {
        signupMsg.textContent = "新規登録に失敗しました：" + (err.message || JSON.stringify(err));
      } finally {
        setButtonState(signupBtn, true);
      }
    });

    signupClear.addEventListener("click", () => {
      signupEmail.value = ""; signupPassword.value = ""; signupPasswordConfirm.value = ""; signupMsg.textContent = "";
    });

    loginBtn.addEventListener("click", async () => {
      loginMsg.textContent = ""; clearHints();
      const email = loginEmail.value.trim();
      const pw = loginPassword.value;
      if (!email || !pw) {
        loginMsg.textContent = "メールアドレスとパスワードを入力してください。";
        return;
      }
      if (!supabase) {
        loginMsg.textContent = "システム未初期化（後で再試行してください）。";
        return;
      }
      setButtonState(loginBtn, false);
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: pw });
        if (error) throw error;
        // successful login will be handled in later parts (session restore and UI)
        loginMsg.textContent = "";
        // placeholder: show success briefly
        loginMsg.textContent = "ログイン成功（処理を続行）";
      } catch (err) {
        showLoginErrorHints(err);
      } finally {
        setButtonState(loginBtn, true);
      }
    });

    loginClear.addEventListener("click", () => {
      loginEmail.value = ""; loginPassword.value = ""; loginMsg.textContent = ""; clearHints();
    });

    // Forgot link handler (will open modal or navigate in later parts)
    forgotLink.addEventListener("click", (e) => {
      e.preventDefault();
      // simple flow: open password recovery URL or show modal (implemented later)
      window.alert("ID/パスワードを忘れた場合の手順を表示します（次のパートで詳細を実装）。");
    });

    helpLink.addEventListener("click", (e) => {
      e.preventDefault();
      window.alert("ヘルプを表示します（次のパートで詳細を実装）。");
    });

    // Expose a small init function for later parts to set supabase client
    window.__app_init_supabase = function(url, key) {
      try {
        const cleanKey = (key || "").replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
        const cleanUrl = (url || "").trim();
        if (!cleanUrl || !cleanKey) {
          console.warn("supabase init: missing url or key");
          return false;
        }
        supabase = window.supabase.createClient(cleanUrl, cleanKey);
        console.log("supabase initialized");
        return true;
      } catch (e) {
        console.error("supabase init error", e);
        return false;
      }
    };

    // quick sanity log
    console.log("Part1 loaded");
  </script>

<!-- Forgot / Reset Modal -->
<div id="forgotModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="forgotTitle" style="position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:9999">
  <div class="panel" style="width:420px;max-width:90%;padding:16px">
    <div class="panel-title" id="forgotTitle">IDまたはパスワードを忘れた方</div>
    <p class="muted small">登録済みのメールアドレスを入力してください。パスワード再設定用のメールを送信します。</p>

<script>
  // DOM references for app area
  const logoutBtn = document.getElementById("logoutBtn");
  const loginUserEmail = document.getElementById("loginUserEmail");

  const dateInput = document.getElementById("dateInput");
  const categorySelect = document.getElementById("categorySelect");
  const memoInput = document.getElementById("memoInput");
  const amountInput = document.getElementById("amountInput");
  const addTxBtn = document.getElementById("addTxBtn");
  const clearInputBtn = document.getElementById("clearInputBtn");

  const categoryNameInput = document.getElementById("categoryNameInput");
  const addCategoryBtn = document.getElementById("addCategoryBtn");
  const categoryList = document.getElementById("categoryList");

  const listArea = document.getElementById("listArea");
  const sumIncome = document.getElementById("sumIncome");
  const sumExpense = document.getElementById("sumExpense");
  const sumNet = document.getElementById("sumNet");

  // Forgot modal DOM
  const forgotModal = document.getElementById("forgotModal");
  const forgotEmail = document.getElementById("forgotEmail");
  const forgotSendBtn = document.getElementById("forgotSendBtn");
  const forgotCloseBtn = document.getElementById("forgotCloseBtn");
  const forgotMsg = document.getElementById("forgotMsg");

  // Supabase client (initialized via Part1's __app_init_supabase)
  let supabase = window.supabase || null;
  let currentUser = null;

  // Utility: set today's date if empty
  function ensureTodayDate() {
    if (!dateInput.value) {
      const t = new Date();
      dateInput.value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
    }
  }

  // Button state helpers
  function setBtn(btn, enabled) {
    btn.disabled = !enabled;
    if (!enabled) btn.style.opacity = "0.6";
    else btn.style.opacity = "1";
  }

  // Event wiring
  logoutBtn.addEventListener("click", async () => {
    if (!supabase) return;
    try { await supabase.auth.signOut(); } catch(e){ console.warn(e); }
    currentUser = null;
    document.getElementById("appArea").classList.add("hidden");
    document.getElementById("appArea").setAttribute("aria-hidden","true");
    loginUserEmail.textContent = "ログイン中";
  });

  addTxBtn.addEventListener("click", async () => {
    if (!supabase || !currentUser) { alert("先にログインしてください。"); return; }
    const date = dateInput.value;
    const categoryId = categorySelect.value;
    const memo = memoInput.value.trim();
    const amount = Number(amountInput.value);
    const type = document.querySelector('input[name="type"]:checked').value;
    if (!date || !categoryId || !amount) { alert("日付・カテゴリ・金額は必須です。"); return; }
    const catOption = categorySelect.options[categorySelect.selectedIndex];
    const categoryName = catOption ? catOption.textContent : "";
    setBtn(addTxBtn, false);
    try {
      const { error } = await supabase.from("transactions").insert({
        user_id: currentUser.id,
        date, category_id: categoryId, category_name: categoryName, memo, amount, type
      });
      if (error) throw error;
      clearInput(false);
      await loadTransactions();
      await renderSummary();
    } catch (err) {
      console.error("addTransaction error", err);
      alert("登録に失敗しました。");
    } finally {
      setBtn(addTxBtn, true);
    }
  });

  clearInputBtn.addEventListener("click", () => clearInput(false));

  addCategoryBtn.addEventListener("click", async () => {
    if (!supabase || !currentUser) { alert("先にログインしてください。"); return; }
    const name = categoryNameInput.value.trim();
    if (!name) return;
    setBtn(addCategoryBtn, false);
    try {
      const { error } = await supabase.from("categories").insert({ user_id: currentUser.id, name });
      if (error) throw error;
      categoryNameInput.value = "";
      await loadCategories();
    } catch (err) {
      console.error("addCategory error", err);
      alert("カテゴリ追加に失敗しました。");
    } finally {
      setBtn(addCategoryBtn, true);
    }
  });

  // Forgot modal handlers
  document.getElementById("forgotLink").addEventListener("click", (e) => {
    e.preventDefault();
    forgotEmail.value = loginEmail.value || "";
    forgotMsg.textContent = "";
    forgotModal.classList.remove("hidden");
  });

  forgotCloseBtn.addEventListener("click", () => {
    forgotModal.classList.add("hidden");
  });

  forgotSendBtn.addEventListener("click", async () => {
    const email = forgotEmail.value.trim();
    if (!email) { forgotMsg.textContent = "メールアドレスを入力してください。"; return; }
    if (!supabase) { forgotMsg.textContent = "システム未初期化です。後で再試行してください。"; return; }
    setBtn(forgotSendBtn, false);
    forgotMsg.textContent = "送信中…";
    try {
      // Try to call reset password; if method unavailable, show message
      if (typeof supabase.auth.resetPasswordForEmail === "function") {
        const { data, error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) throw error;
        forgotMsg.textContent = "再設定メールを送信しました。メールを確認してください。";
      } else if (typeof supabase.auth.api !== "undefined" && typeof supabase.auth.api.resetPasswordForEmail === "function") {
        // older compatibility
        const { data, error } = await supabase.auth.api.resetPasswordForEmail(email);
        if (error) throw error;
        forgotMsg.textContent = "再設定メールを送信しました。メールを確認してください。";
      } else {
        forgotMsg.textContent = "パスワード再設定機能は現在利用できません。管理者に連絡してください。";
      }
    } catch (err) {
      console.error("forgot error", err);
      forgotMsg.textContent = "送信に失敗しました：" + (err.message || "");
    } finally {
      setBtn(forgotSendBtn, true);
    }
  });

  // Data loading / rendering functions (used after login)
  async function loadCategories() {
    if (!supabase || !currentUser) return;
    try {
      const { data, error } = await supabase.from("categories").select("*").eq("user_id", currentUser.id).order("name",{ascending:true});
      if (error) throw error;
      categorySelect.innerHTML = "";
      const opt = document.createElement("option"); opt.value=""; opt.textContent="カテゴリを選択"; categorySelect.appendChild(opt);
      categoryList.innerHTML = "";
      (data||[]).forEach(cat => {
        const o = document.createElement("option"); o.value = cat.id; o.textContent = cat.name; categorySelect.appendChild(o);
        const div = document.createElement("div"); div.style.display="flex"; div.style.justifyContent="space-between"; div.style.alignItems="center"; div.style.padding="6px 0";
        const span = document.createElement("span"); span.textContent = cat.name;
        const btn = document.createElement("button"); btn.textContent="削除"; btn.className="btn-sub"; btn.style.fontSize="12px"; btn.onclick = async () => {
          if (!confirm("このカテゴリを削除しますか？（紐づく明細は残ります）")) return;
          try {
            const { error } = await supabase.from("categories").delete().eq("id", cat.id).eq("user_id", currentUser.id);
            if (error) throw error;
            await loadCategories();
          } catch (err) { console.error("deleteCategory error", err); alert("カテゴリ削除に失敗しました。"); }
        };
        div.appendChild(span); div.appendChild(btn); categoryList.appendChild(div);
      });
    } catch (err) { console.error("loadCategories error", err); }
  }

  async function loadTransactions() {
    if (!supabase || !currentUser) return;
    try {
      const { data, error } = await supabase.from("transactions").select("id,date,category_name,memo,amount,type").eq("user_id", currentUser.id).order("date",{ascending:true}).order("id",{ascending:true});
      if (error) throw error;
      renderList(data || []);
    } catch (err) { console.error("loadTransactions error", err); }
  }

  function renderList(rows) {
    listArea.innerHTML = "";
    if (!rows || rows.length === 0) { listArea.textContent = "データがありません。"; return; }
    rows.forEach(r => {
      const div = document.createElement("div"); div.className = "list-item";
      const d = document.createElement("div"); d.textContent = r.date || "";
      const m = document.createElement("div"); m.textContent = r.memo || "";
      const c = document.createElement("div"); c.textContent = r.category_name || "";

<script>
  // Part3: Supabase 初期化と認証状態ハンドリング
  (function(){
    // local references (may already exist from earlier parts)
    window.__app_supabase = window.__app_supabase || null;
    window.__app_currentUser = window.__app_currentUser || null;

    // sanitize inputs
    function cleanString(s) {
      return (s || "").replace(/[\u200B-\u200D\uFEFF]/g, "").trim();
    }

    // initialize supabase client and attach auth listener
    async function initSupabase(url, key) {
      try {
        const u = cleanString(url);
        const k = cleanString(key);
        if (!u || !k) {
          console.warn("initSupabase: missing url or key");
          return false;
        }
        window.__app_supabase = window.supabase.createClient(u, k);

        // auth state change listener
        try {
          window.__app_supabase.auth.onAuthStateChange((event, session) => {
            // event examples: SIGNED_IN, SIGNED_OUT, PASSWORD_RECOVERY, USER_UPDATED
            if (session && session.user) {
              window.__app_currentUser = session.user;
              onUserSignedIn(session.user);
            } else {
              window.__app_currentUser = null;
              onUserSignedOut();
            }
          });
        } catch (e) {
          console.warn("onAuthStateChange not available", e);
        }

        // attempt to restore session immediately
        try {
          const { data } = await window.__app_supabase.auth.getSession();
          if (data && data.session && data.session.user) {
            window.__app_currentUser = data.session.user;
            onUserSignedIn(data.session.user);
          } else {
            onUserSignedOut();
          }
        } catch (e) {
          console.warn("getSession error", e);
        }

        // expose globally for other parts
        window.__app_after_init && window.__app_after_init();
        return true;
      } catch (err) {
        console.error("initSupabase error", err);
        return false;
      }
    }

    // UI helpers when user signs in/out
    function onUserSignedIn(user) {
      try {
        currentUser = user;
      } catch(e){}
      try {
        document.getElementById("appArea").classList.remove("hidden");
        document.getElementById("appArea").setAttribute("aria-hidden","false");
      } catch(e){}
      try {
        const label = document.getElementById("loginUserEmail");
        if (label) label.textContent = user.email || "ログイン中";
      } catch(e){}
      // ensure date and load data
      try { ensureTodayDate(); } catch(e){}
      // call data loaders if available
      (async () => {
        try { await loadCategories(); } catch(e){}
        try { await loadTransactions(); } catch(e){}
        try { await renderSummary(); } catch(e){}
      })();
    }

    function onUserSignedOut() {
      try {
        currentUser = null;
      } catch(e){}
      try {
        document.getElementById("appArea").classList.add("hidden");
        document.getElementById("appArea").setAttribute("aria-hidden","true");
      } catch(e){}
      try {
        const label = document.getElementById("loginUserEmail");
        if (label) label.textContent = "ログイン中";
      } catch(e){}
      try {
        listArea.innerHTML = "";
        sumIncome.textContent = "0";
        sumExpense.textContent = "0";
        sumNet.textContent = "0";
      } catch(e){}
    }

    // wire up login/signup to use the initialized client if user clicked before init
    // override click handlers to ensure they use the live client
    function ensureHandlers() {
      // signup
      const sBtn = document.getElementById("signupBtn");
      if (sBtn) {
        sBtn.addEventListener("click", async (ev) => {
          signupMsg.textContent = "";
          const email = signupEmail.value.trim();
          const pw = signupPassword.value;
          const confirm = signupPasswordConfirm.value;
          const v = validatePasswordClient(pw, confirm);
          if (!v.ok) { signupMsg.textContent = v.msg; return; }
          if (!window.__app_supabase) { signupMsg.textContent = "システム未初期化です。後で再試行してください。"; return; }
          setButtonState(sBtn, false);
          try {
            const res = await window.__app_supabase.auth.signUp({ email, password: pw });
            if (res.error) throw res.error;
            signupMsg.textContent = "確認メールを送信しました。メールを確認してください。";
            signupEmail.value = ""; signupPassword.value = ""; signupPasswordConfirm.value = "";
          } catch (err) {
            signupMsg.textContent = "新規登録に失敗しました：" + (err.message || JSON.stringify(err));
          } finally {
            setButtonState(sBtn, true);
          }
        }, { once: true });
      }

      // login
      const lBtn = document.getElementById("loginBtn");
      if (lBtn) {
        lBtn.addEventListener("click", async (ev) => {
          loginMsg.textContent = ""; clearHints();
          const email = loginEmail.value.trim();
          const pw = loginPassword.value;
          if (!email || !pw) {
            loginMsg.textContent = "メールアドレスとパスワードを入力してください。";
            return;
          }
          if (!window.__app_supabase) {
            loginMsg.textContent = "システム未初期化です。後で再試行してください。";
            return;
          }
          setButtonState(lBtn, false);
          try {
            const { data, error } = await window.__app_supabase.auth.signInWithPassword({ email, password: pw });
            if (error) throw error;
            // onAuthStateChange will handle UI; but ensure immediate update if session returned
            if (data && data.user) {
              onUserSignedIn(data.user);
            }
            loginMsg.textContent = "";
          } catch (err) {
            showLoginErrorHints(err);
          } finally {
            setButtonState(lBtn, true);
          }
        }, { once: true });
      }
    }

    // small helper to set disabled style
    function setButtonState(btn, enabled) {
      try {
        btn.disabled = !enabled;
        btn.style.opacity = enabled ? "1" : "0.6";
      } catch(e){}
    }

    // expose init function globally
    window.__app_init = async function(url, key) {
      const ok = await initSupabase(url, key);
      if (ok) {
        // rebind handlers to use the initialized client
        try { ensureHandlers(); } catch(e){}
        // call after init hook if present
        try { window.__app_after_init && window.__app_after_init(); } catch(e){}
      }
      return ok;
    };

    // auto-run if __app_init_supabase was called earlier (compat)
    if (typeof window.__app_init_supabase === "function" && !window.__app_supabase) {
      // do not auto-call with empty values; caller should pass url/key
      // keep for compatibility
    }

    // expose small debug
    console.log("Part3 loaded: supabase init and auth handlers ready");
  })();
</script>

<script>
  // Part4: 認証処理の補完・パスワード再設定・ユーティリティ
  (function(){
    // safe references
    const _getSupabase = () => window.__app_supabase || (window.supabase && window.supabase.createClient ? window.supabase : null);

    // show transient message
    function flash(el, msg, timeout = 4000) {
      if (!el) return;
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, timeout);
    }

    // map supabase auth errors to friendly text (used by showLoginErrorHints too)
    function friendlyAuthMessage(err) {
      if (!err) return "認証に失敗しました。";
      const m = (err.message || "").toLowerCase();
      if (m.includes("invalid") && m.includes("email")) return "メールアドレスの形式を確認してください。";
      if (m.includes("invalid") && m.includes("password")) return "パスワードが正しくありません。";
      if (m.includes("invalid login") || m.includes("invalid credentials")) return "メールアドレスまたはパスワードが正しくありません。";
      if (m.includes("not confirmed") || m.includes("email not confirmed") || m.includes("confirm")) return "メールアドレスの確認が必要です。確認メールをチェックしてください。";
      if (m.includes("rate limit") || m.includes("too many")) return "試行回数が多すぎます。しばらく待ってから再試行してください。";
      return err.message || "認証に失敗しました。";
    }

    // expose a helper to initialize with URL/key (convenience)
    window.__app_configure = async function(url, key) {
      try {
        const ok = await window.__app_init(url, key);
        if (ok) {
          // after init, call after_init hook
          try { window.__app_after_init && window.__app_after_init(); } catch(e){}
        }
        return ok;
      } catch (e) {
        console.error("configure error", e);
        return false;
      }
    };

    // Password reset (alternative flow if resetPasswordForEmail not present)
    async function sendPasswordReset(email) {
      const client = _getSupabase();

      if (typeof client.auth.resetPasswordForEmail === "function") {
        return await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
      }
      // fallback older API
      if (client.auth.api && typeof client.auth.api.resetPasswordForEmail === "function") {
        return await client.auth.api.resetPasswordForEmail(email);
      }
      throw new Error("パスワード再設定機能が利用できません");

          setBtn(forgotSendBtn, true);
        }
      });

    function setBtn(btn, enabled) {
      if (!btn) return;
      btn.disabled = !enabled;
      btn.style.opacity = enabled ? "1" : "0.6";
    }

    // ensure login/signup handlers are robust if user clicked before init

    const attachRobustHandlers = () => {
      const sBtn = document.getElementById("signupBtn");
      if (sBtn && !sBtn.__robust) {
        sBtn.__robust = true;
        sBtn.addEventListener("click", async () => {
          signupMsg.textContent = "";
          const email = signupEmail.value.trim();
          const pw = signupPassword.value;
          const confirm = signupPasswordConfirm.value;

          const client = _getSupabase();

          setBtn(sBtn, false);
          try {
            const res = await client.auth.signUp({ email, password: pw });
            if (res.error) throw res.error;
            signupMsg.textContent = "確認メールを送信しました。メールを確認してください。";
            signupEmail.value = ""; signupPassword.value = ""; signupPasswordConfirm.value = "";
          } catch (err) {
            console.error("signup error", err);
            signupMsg.textContent = friendlyAuthMessage(err);
          } finally {
            setBtn(sBtn, true);
          }
        });
      }

      const lBtn = document.getElementById("loginBtn");
      if (lBtn && !lBtn.__robust) {
        lBtn.__robust = true;
        lBtn.addEventListener("click", async () => {
          loginMsg.textContent = ""; clearHints();
          const email = loginEmail.value.trim();
          const pw = loginPassword.value;
          if (!email || !pw) { loginMsg.textContent = "メールアドレスとパスワードを入力してください。"; return; }

<script>

    const getClient = () => window.__app_supabase || (window.supabase && window.supabase.createClient ? window.supabase : null);

    async function safeLoadCategories() {

    async function safeLoadTransactions() {
      try { await loadTransactions(); } catch (e) { console.warn("safeLoadTransactions", e); }

    function enableAllButtons() {
      Array.from(document.querySelectorAll("button")).forEach(b => { b.disabled = false; b.style.opacity = "1"; });
    }

    // Global error handler to surface unexpected exceptions to console and UI
    window.addEventListener("error", (ev) => {
