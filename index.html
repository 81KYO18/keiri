<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>極密アプリ Ultimate Secure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --panel-soft: #111827;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.15);
      --danger: #f97373;
      --text: #e5e7eb;
      --sub: #9ca3af;
      --income: #4ade80;
      --expense: #f97373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 55%, #000 100%);
      color: var(--text);
    }

    h1 {
      margin: 8px 0 16px;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .auth-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .panel {
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(15,23,42,0.9));
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
    }

    .panel-title {
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    .auth-panel {
      flex: 1 1 260px;
    }

    .auth-panel input {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 13px;
    }

    .auth-panel button {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.6);
      background: #020617;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .auth-panel button:hover {
      border-color: var(--accent);
      background: rgba(15,23,42,0.9);
    }

    .auth-msg {
      margin-top: 4px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 12px;
    }

    @media (max-width: 960px) {
      .app-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .field-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .field-row input,
    .field-row select {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 13px;
    }

    .field-row input[type="date"] {
      min-width: 130px;
      flex: 0 0 auto;
    }

    .field-row input[type="number"] {
      max-width: 140px;
      flex: 0 0 auto;
      text-align: right;
    }

    .field-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--sub);
    }

    .btn-main {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-main:hover {
      background: rgba(56,189,248,0.25);
    }

    .btn-sub {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.6);
      background: #020617;
      color: var(--sub);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sub:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .list {
      max-height: 420px;
      overflow-y: auto;
      font-size: 12px;
    }

    .list-item {
      display: grid;
      grid-template-columns: 70px 1fr 80px 70px 60px;
      gap: 4px;
      padding: 4px 6px;
      border-bottom: 1px solid rgba(31,41,55,0.9);
      align-items: center;
    }

    .list-item:nth-child(2n) {
      background: rgba(15,23,42,0.7);
    }

    .list-item-amount.income { color: var(--income); }
    .list-item-amount.expense { color: var(--expense); }

    .summary-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .summary-row span {
      display: flex;
      justify-content: space-between;
    }

    .summary-row strong {
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.5);
      font-size: 11px;
      color: var(--sub);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .logout-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>極密アプリ Ultimate Secure</h1>

    <!-- 認証エリア -->
    <div class="auth-row">
      <div class="panel auth-panel">
        <div class="panel-title">新規登録</div>
        <input id="signupEmail" type="email" placeholder="新規登録メールアドレス">
        <input id="signupPassword" type="password" placeholder="新規登録パスワード（6文字以上）">
        <button onclick="signup()">新規登録</button>
        <div id="signupMsg" class="auth-msg"></div>
      </div>

      <div class="panel auth-panel">
        <div class="panel-title">ログイン</div>
        <input id="loginEmail" type="email" placeholder="メールアドレス">
        <input id="loginPassword" type="password" placeholder="パスワード">
        <button onclick="login()">ログイン</button>
        <div id="loginMsg" class="auth-msg"></div>
      </div>
    </div>

    <!-- ログイン後エリア -->
    <div id="appArea" class="hidden">
      <div class="logout-row">
        <span class="badge" id="loginUserLabel">
          <span class="badge-dot"></span>
          <span id="loginUserEmail">ログイン中</span>
        </span>
        <button class="btn-sub" style="margin-left:8px;" onclick="logout()">ログアウト</button>
      </div>

      <div class="app-grid">
        <!-- 入力パネル -->
        <div class="panel">
          <div class="panel-title">入力</div>

          <div class="field-row">
            <input id="dateInput" type="date">
            <select id="categorySelect"></select>
          </div>

          <div class="field-row">
            <input id="memoInput" type="text" placeholder="メモ">
          </div>

          <div class="field-row">
            <input id="amountInput" type="number" placeholder="金額">
            <label>
              <input type="radio" name="type" value="expense" checked> 支出
            </label>
            <label>
              <input type="radio" name="type" value="income"> 収入
            </label>
          </div>

          <div class="field-row">
            <button class="btn-main" onclick="addTransaction()">登録</button>
            <button class="btn-sub" onclick="clearInput()">クリア</button>
          </div>

          <hr style="border:none;border-top:1px solid rgba(31,41,55,0.9);margin:10px 0;">

          <div class="panel-title">カテゴリ</div>
          <div class="field-row">
            <input id="categoryNameInput" type="text" placeholder="カテゴリ名（例：食費）">
            <button class="btn-sub" onclick="addCategory()">追加</button>
          </div>

          <div id="categoryList" style="font-size:12px;color:var(--sub);max-height:120px;overflow-y:auto;"></div>
        </div>

        <!-- 一覧パネル -->
        <div class="panel">
          <div class="panel-title">一覧</div>
          <div class="list" id="listArea"></div>
        </div>

        <!-- 集計パネル -->
        <div class="panel">
          <div class="panel-title">集計</div>
          <div class="summary-row" id="summaryArea">
            <span><strong>収入合計</strong><span id="sumIncome">0</span></span>
            <span><strong>支出合計</strong><span id="sumExpense">0</span></span>
            <span><strong>差引</strong><span id="sumNet">0</span></span>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    /* ★ Supabase 初期化（恭平のURL / anon key をそのまま使用） */
    const supabaseUrl = "https://dgkltvgjhjvhodleawuq.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRna2x0dmdqaGp2aG9kbGVhd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDgxNDksImV4cCI6MjA5NTg4NDE0OX0._kS7sxV0Isqhr78mQW6VxR1Nc34AhHa2prb2OtlsuE8";

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    /* DOM 参照 */
    const signupEmail = document.getElementById("signupEmail");
    const signupPassword = document.getElementById("signupPassword");
    const signupMsg = document.getElementById("signupMsg");

    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginMsg = document.getElementById("loginMsg");

    const appArea = document.getElementById("appArea");
    const loginUserEmail = document.getElementById("loginUserEmail");

    const dateInput = document.getElementById("dateInput");
    const categorySelect = document.getElementById("categorySelect");
    const memoInput = document.getElementById("memoInput");
    const amountInput = document.getElementById("amountInput");

    const categoryNameInput = document.getElementById("categoryNameInput");
    const categoryList = document.getElementById("categoryList");

    const listArea = document.getElementById("listArea");
    const sumIncome = document.getElementById("sumIncome");
    const sumExpense = document.getElementById("sumExpense");
    const sumNet = document.getElementById("sumNet");

    /* ログイン中ユーザー */
    let currentUser = null;
    /* ============================
       認証：新規登録
    ============================ */
    async function signup() {
      signupMsg.textContent = "";
      const email = signupEmail.value.trim();
      const password = signupPassword.value.trim();

      if (!email || !password) {
        signupMsg.textContent = "メールアドレスとパスワードを入力してください。";
        return;
      }
      if (password.length < 6) {
        signupMsg.textContent = "パスワードは6文字以上にしてください。";
        return;
      }

      const { data, error } = await supabase.auth.signUp({ email, password });

      if (error) {
        console.error(error);
        signupMsg.textContent = "新規登録に失敗しました：" + (error.message || "");
        return;
      }

      alert("新規登録が完了しました。ログインしてください。");
      signupEmail.value = "";
      signupPassword.value = "";
    }


    /* ============================
       認証：ログイン
    ============================ */
    async function login() {
      loginMsg.textContent = "";
      const email = loginEmail.value.trim();
      const password = loginPassword.value.trim();

      if (!email || !password) {
        loginMsg.textContent = "メールアドレスとパスワードを入力してください。";
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        console.error(error);
        loginMsg.textContent = "ログインに失敗しました：" + (error.message || "");
        return;
      }

      currentUser = data.user;
      loginUserEmail.textContent = currentUser.email || "ログイン中";
      appArea.classList.remove("hidden");
      loginMsg.textContent = "";

      // 日付初期化
      if (!dateInput.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }

      await loadCategories();
      await loadTransactions();
      await renderSummary();
    }


    /* ============================
       認証：ログアウト
    ============================ */
    async function logout() {
      await supabase.auth.signOut();
      currentUser = null;

      appArea.classList.add("hidden");
      loginUserEmail.textContent = "ログイン中";

      listArea.innerHTML = "";
      sumIncome.textContent = "0";
      sumExpense.textContent = "0";
      sumNet.textContent = "0";
    }


    /* ============================
       ページ読み込み時：セッション復元
    ============================ */
    (async () => {
      const { data } = await supabase.auth.getSession();

      if (data.session && data.session.user) {
        currentUser = data.session.user;
        loginUserEmail.textContent = currentUser.email || "ログイン中";
        appArea.classList.remove("hidden");

        if (!dateInput.value) {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, "0");
          const dd = String(today.getDate()).padStart(2, "0");
          dateInput.value = `${yyyy}-${mm}-${dd}`;
        }

        await loadCategories();
        await loadTransactions();
        await renderSummary();
      }
    })();

    /* ============================
       カテゴリ読み込み
    ============================ */
    async function loadCategories() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("categories")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("name", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      categorySelect.innerHTML = "";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "カテゴリを選択";
      categorySelect.appendChild(opt);

      categoryList.innerHTML = "";

      data.forEach(cat => {
        const o = document.createElement("option");
        o.value = cat.id;
        o.textContent = cat.name;
        categorySelect.appendChild(o);

        const div = document.createElement("div");
        div.textContent = cat.name;
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.padding = "2px 0";

        const btn = document.createElement("button");
        btn.textContent = "削除";
        btn.className = "btn-sub";
        btn.style.fontSize = "11px";
        btn.onclick = () => deleteCategory(cat.id);

        div.appendChild(btn);
        categoryList.appendChild(div);
      });
    }


    /* ============================
       カテゴリ追加
    ============================ */
    async function addCategory() {
      if (!currentUser) {
        alert("先にログインしてください。");
        return;
      }

      const name = categoryNameInput.value.trim();
      if (!name) return;

      const { error } = await supabase
        .from("categories")
        .insert({ user_id: currentUser.id, name });

      if (error) {
        console.error(error);
        alert("カテゴリ追加に失敗しました。");
        return;
      }

      categoryNameInput.value = "";
      await loadCategories();
    }


    /* ============================
       カテゴリ削除
    ============================ */
    async function deleteCategory(id) {
      if (!currentUser) return;
      if (!confirm("このカテゴリを削除しますか？（紐づく明細は残ります）")) return;

      const { error } = await supabase
        .from("categories")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) {
        console.error(error);
        alert("カテゴリ削除に失敗しました。");
        return;
      }

      await loadCategories();
    }


    /* ============================
       明細読み込み
    ============================ */
    async function loadTransactions() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("transactions")
        .select("id, date, category_name, memo, amount, type")
        .eq("user_id", currentUser.id)
        .order("date", { ascending: true })
        .order("id", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      renderList(data);
    }


    /* ============================
       明細登録
    ============================ */
    async function addTransaction() {
      if (!currentUser) {
        alert("先にログインしてください。");
        return;
      }

      const date = dateInput.value;
      const categoryId = categorySelect.value;
      const memo = memoInput.value.trim();
      const amount = Number(amountInput.value);
      const type = document.querySelector('input[name="type"]:checked').value;

      if (!date || !categoryId || !amount) {
        alert("日付・カテゴリ・金額は必須です。");
        return;
      }

      const catOption = categorySelect.options[categorySelect.selectedIndex];
      const categoryName = catOption ? catOption.textContent : "";

      const { error } = await supabase
        .from("transactions")
        .insert({
          user_id: currentUser.id,
          date,
          category_id: categoryId,
          category_name: categoryName,
          memo,
          amount,
          type
        });

      if (error) {
        console.error(error);
        alert("登録に失敗しました。");
        return;
      }

      clearInput(false);
      await loadTransactions();
      await renderSummary();
    }


    /* ============================
       明細削除
    ============================ */
    async function deleteTransaction(id) {
      if (!currentUser) return;
      if (!confirm("この明細を削除しますか？")) return;

      const { error } = await supabase
        .from("transactions")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) {
        console.error(error);
        alert("削除に失敗しました。");
        return;
      }

      await loadTransactions();
      await renderSummary();
    }


    /* ============================
       一覧描画
    ============================ */
    function renderList(rows) {
      listArea.innerHTML = "";

      if (!rows || rows.length === 0) {
        listArea.textContent = "データがありません。";
        return;
      }

      rows.forEach(r => {
        const div = document.createElement("div");
        div.className = "list-item";

        const d = document.createElement("div");
        d.textContent = r.date;

        const m = document.createElement("div");
        m.textContent = r.memo || "";

        const c = document.createElement("div");
        c.textContent = r.category_name || "";

        const a = document.createElement("div");
        a.className = "list-item-amount " + (r.type === "income" ? "income" : "expense");
        a.textContent = (r.type === "income" ? "+" : "-") + Number(r.amount).toLocaleString();

        const btn = document.createElement("button");
        btn.textContent = "削除";
        btn.className = "btn-sub";
        btn.style.fontSize = "11px";
        btn.onclick = () => deleteTransaction(r.id);

        div.appendChild(d);
        div.appendChild(m);
        div.appendChild(c);
        div.appendChild(a);
        div.appendChild(btn);

        listArea.appendChild(div);
      });
    }


    /* ============================
       集計
    ============================ */
    async function renderSummary() {
      if (!currentUser) return;

      const { data, error } = await supabase
        .from("transactions")
        .select("amount, type")
        .eq("user_id", currentUser.id);

      if (error) {
        console.error(error);
        return;
      }

      let income = 0;
      let expense = 0;

      data.forEach(r => {
        if (r.type === "income") income += Number(r.amount) || 0;
        else expense += Number(r.amount) || 0;
      });

      sumIncome.textContent = income.toLocaleString();
      sumExpense.textContent = expense.toLocaleString();
      sumNet.textContent = (income - expense).toLocaleString();
    }


    /* ============================
       入力クリア
    ============================ */
      function clearInput(clearDate = false) {
      if (clearDate) dateInput.value = "";
      memoInput.value = "";
      amountInput.value = "";
    }

  </script>
</body>
</html>
