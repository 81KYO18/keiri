<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>極密アプリ Ultimate Secure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --panel-soft: #111827;
      --border: #1f2937;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.15);
      --danger: #f97373;
      --text: #e5e7eb;
      --sub: #9ca3af;
      --income: #4ade80;
      --expense: #f97373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 55%, #000 100%);
      color: var(--text);
    }

    h1 {
      margin: 8px 0 16px;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
    }

    .auth-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .panel {
      background: linear-gradient(135deg, rgba(15,23,42,0.98), rgba(15,23,42,0.9));
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
    }

    .panel-title {
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    .auth-panel {
      flex: 1 1 260px;
    }

    .auth-panel input {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 13px;
    }

    .auth-panel button {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.6);
      background: #020617;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .auth-panel button:hover {
      border-color: var(--accent);
      background: rgba(15,23,42,0.9);
    }

    .auth-msg {
      margin-top: 4px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 12px;
    }

    @media (max-width: 960px) {
      .app-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .field-row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .field-row input,
    .field-row select {
      flex: 1;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 13px;
    }

    .field-row input[type="date"] {
      min-width: 130px;
      flex: 0 0 auto;
    }

    .field-row input[type="number"] {
      max-width: 140px;
      flex: 0 0 auto;
      text-align: right;
    }

    .field-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--sub);
    }

    .btn-main {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-main:hover {
      background: rgba(56,189,248,0.25);
    }

    .btn-sub {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.6);
      background: #020617;
      color: var(--sub);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sub:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .list {
      max-height: 420px;
      overflow-y: auto;
      font-size: 12px;
    }

    .list-item {
      display: grid;
      grid-template-columns: 70px 1fr 80px 70px 60px;
      gap: 4px;
      padding: 4px 6px;
      border-bottom: 1px solid rgba(31,41,55,0.9);
      align-items: center;
    }

    .list-item:nth-child(2n) {
      background: rgba(15,23,42,0.7);
    }

    .list-item-amount.income { color: var(--income); }
    .list-item-amount.expense { color: var(--expense); }

    .summary-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .summary-row span {
      display: flex;
      justify-content: space-between;
    }

    .summary-row strong {
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.5);
      font-size: 11px;
      color: var(--sub);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .logout-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>極密アプリ Ultimate Secure</h1>

    <!-- 認証エリア -->
    <div class="auth-row">
      <div class="panel auth-panel">
        <div class="panel-title">新規登録</div>
        <input id="signupEmail" type="email" placeholder="新規登録メールアドレス" autocomplete="email">
        <input id="signupPassword" type="password" placeholder="新規登録パスワード（6文字以上）" autocomplete="new-password">
        <button id="signupBtn" onclick="signup()">新規登録</button>
        <div id="signupMsg" class="auth-msg" aria-live="polite"></div>
      </div>

      <div class="panel auth-panel">
        <div class="panel-title">ログイン</div>
        <input id="loginEmail" type="email" placeholder="メールアドレス" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="パスワード" autocomplete="current-password">
        <button id="loginBtn" onclick="login()">ログイン</button>
        <div id="loginMsg" class="auth-msg" aria-live="polite"></div>
      </div>
    </div>

    <!-- ログイン後エリア -->
    <div id="appArea" class="hidden" aria-hidden="true">
      <div class="logout-row">
        <span class="badge" id="loginUserLabel" role="status" aria-live="polite">
          <span class="badge-dot" aria-hidden="true"></span>
          <span id="loginUserEmail">ログイン中</span>
        </span>
        <button id="logoutBtn" class="btn-sub" style="margin-left:8px;" onclick="logout()">ログアウト</button>
      </div>

      <div class="app-grid">
        <!-- 入力パネル -->
        <div class="panel">
          <div class="panel-title">入力</div>

          <div class="field-row">
            <input id="dateInput" type="date" aria-label="日付">
            <select id="categorySelect" aria-label="カテゴリ"></select>
          </div>

          <div class="field-row">
            <input id="memoInput" type="text" placeholder="メモ" aria-label="メモ">
          </div>

          <div class="field-row">
            <input id="amountInput" type="number" placeholder="金額" aria-label="金額" min="0" step="1">
            <label><input type="radio" name="type" value="expense" checked> 支出</label>
            <label><input type="radio" name="type" value="income"> 収入</label>
          </div>

          <div class="field-row">
            <button class="btn-main" onclick="addTransaction()">登録</button>
            <button class="btn-sub" onclick="clearInput()">クリア</button>
          </div>

          <hr style="border:none;border-top:1px solid rgba(31,41,55,0.9);margin:10px 0;">

          <div class="panel-title">カテゴリ</div>
          <div class="field-row">
            <input id="categoryNameInput" type="text" placeholder="カテゴリ名（例：食費）" aria-label="カテゴリ名">
            <button class="btn-sub" onclick="addCategory()">追加</button>
          </div>

          <div id="categoryList" style="font-size:12px;color:var(--sub);max-height:120px;overflow-y:auto;"></div>
        </div>

        <!-- 一覧パネル -->
        <div class="panel">
          <div class="panel-title">一覧</div>
          <div class="list" id="listArea" role="list"></div>
        </div>

        <!-- 集計パネル -->
        <div class="panel">
          <div class="panel-title">集計</div>
          <div class="summary-row" id="summaryArea" aria-live="polite">
            <span><strong>収入合計</strong><span id="sumIncome">0</span></span>
            <span><strong>支出合計</strong><span id="sumExpense">0</span></span>
            <span><strong>差引</strong><span id="sumNet">0</span></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase client: この行に余分な空白や不可視文字を入れないこと -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  /* ============================
     Supabase 初期化（ここにあなたの URL と anon key を入れてください）
     注意：URL に /rest/v1/ を付けないこと。行末に全角スペースを入れないこと。
  ============================ */
  const supabaseUrl = "https://dgkltvgjhjvhodleawuq.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRna2x0dmdqaGp2aG9kbGVhd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDgxNDksImV4cCI6MjA5NTg4NDE0OX0._kS7sxV0Isqhr78mQW6VxR1Nc34AhHa2prb2OtlsuE8";

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  /* ============================
     DOM 要素参照（必ず id と一致させる）
  ============================ */
  const signupEmail = document.getElementById("signupEmail");
  const signupPassword = document.getElementById("signupPassword");
  const signupMsg = document.getElementById("signupMsg");

  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");
  const loginMsg = document.getElementById("loginMsg");

  const appArea = document.getElementById("appArea");
  const loginUserEmail = document.getElementById("loginUserEmail");

  const dateInput = document.getElementById("dateInput");
  const categorySelect = document.getElementById("categorySelect");
  const memoInput = document.getElementById("memoInput");
  const amountInput = document.getElementById("amountInput");

  const categoryNameInput = document.getElementById("categoryNameInput");
  const categoryList = document.getElementById("categoryList");

  const listArea = document.getElementById("listArea");
  const sumIncome = document.getElementById("sumIncome");
  const sumExpense = document.getElementById("sumExpense");
  const sumNet = document.getElementById("sumNet");

  /* ログイン中ユーザー情報 */
  let currentUser = null;

  /* ============================
     ユーティリティ：エレメント存在チェック（デバッグ用）
     ページ読み込み時に必須要素が揃っているか確認する
  ============================ */
  (function verifyDom() {
    const required = [
      "signupEmail","signupPassword","signupMsg",
      "loginEmail","loginPassword","loginMsg",
      "appArea","loginUserEmail",
      "dateInput","categorySelect","memoInput","amountInput",
      "categoryNameInput","categoryList",
      "listArea","sumIncome","sumExpense","sumNet"
    ];
    const missing = required.filter(id => !document.getElementById(id));
    if (missing.length) {
      console.warn("Missing DOM elements:", missing);
    }
  })();
</script>
<script>
  /* ============================
     認証：新規登録 / ログイン / ログアウト
  ============================ */
  async function signup() {
    signupMsg.textContent = "";
    const email = signupEmail.value.trim();
    const password = signupPassword.value.trim();

    if (!email || !password) {
      signupMsg.textContent = "メールアドレスとパスワードを入力してください。";
      return;
    }
    if (password.length < 6) {
      signupMsg.textContent = "パスワードは6文字以上にしてください。";
      return;
    }

    try {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;
      alert("新規登録が完了しました。確認メールを確認してからログインしてください。");
      signupEmail.value = "";
      signupPassword.value = "";
    } catch (err) {
      console.error(err);
      signupMsg.textContent = "新規登録に失敗しました：" + (err.message || err);
    }
  }

  async function login() {
    loginMsg.textContent = "";
    const email = loginEmail.value.trim();
    const password = loginPassword.value.trim();

    if (!email || !password) {
      loginMsg.textContent = "メールアドレスとパスワードを入力してください。";
      return;
    }

    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;

      currentUser = data.user;
      loginUserEmail.textContent = currentUser.email || "ログイン中";
      appArea.classList.remove("hidden");
      appArea.setAttribute("aria-hidden", "false");
      loginMsg.textContent = "";

      // 日付初期化（ログイン時）
      if (!dateInput.value) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        dateInput.value = `${yyyy}-${mm}-${dd}`;
      }

      await loadCategories();
      await loadTransactions();
      await renderSummary();
    } catch (err) {
      console.error(err);
      loginMsg.textContent = "ログインに失敗しました：" + (err.message || err);
    }
  }

  async function logout() {
    try {
      await supabase.auth.signOut();
    } catch (err) {
      console.warn("signOut error", err);
    }
    currentUser = null;
    appArea.classList.add("hidden");
    appArea.setAttribute("aria-hidden", "true");
    loginUserEmail.textContent = "ログイン中";

    listArea.innerHTML = "";
    sumIncome.textContent = "0";
    sumExpense.textContent = "0";
    sumNet.textContent = "0";
  }

  /* ============================
     ページ読み込み時：セッション復元
  ============================ */
  (async () => {
    try {
      const { data } = await supabase.auth.getSession();
      if (data && data.session && data.session.user) {
        currentUser = data.session.user;
        loginUserEmail.textContent = currentUser.email || "ログイン中";
        appArea.classList.remove("hidden");
        appArea.setAttribute("aria-hidden", "false");

        if (!dateInput.value) {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, "0");
          const dd = String(today.getDate()).padStart(2, "0");
          dateInput.value = `${yyyy}-${mm}-${dd}`;
        }

        await loadCategories();
        await loadTransactions();
        await renderSummary();
      }
    } catch (err) {
      console.error("session restore error", err);
    }
  })();

  /* ============================
     カテゴリ読み込み / 追加 / 削除
  ============================ */
  async function loadCategories() {
    if (!currentUser) return;

    try {
      const { data, error } = await supabase
        .from("categories")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("name", { ascending: true });

      if (error) throw error;

      categorySelect.innerHTML = "";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "カテゴリを選択";
      categorySelect.appendChild(opt);

      categoryList.innerHTML = "";

      data.forEach(cat => {
        const o = document.createElement("option");
        o.value = cat.id;
        o.textContent = cat.name;
        categorySelect.appendChild(o);

        const div = document.createElement("div");
        div.textContent = cat.name;
        div.style.display = "flex";
        div.style.justifyContent = "space-between";
        div.style.alignItems = "center";
        div.style.padding = "2px 0";

        const btn = document.createElement("button");
        btn.textContent = "削除";
        btn.className = "btn-sub";
        btn.style.fontSize = "11px";
        btn.onclick = () => deleteCategory(cat.id);

        div.appendChild(btn);
        categoryList.appendChild(div);
      });
    } catch (err) {
      console.error("loadCategories error", err);
    }
  }

  async function addCategory() {
    if (!currentUser) {
      alert("先にログインしてください。");
      return;
    }

    const name = categoryNameInput.value.trim();
    if (!name) return;

    try {
      const { error } = await supabase
        .from("categories")
        .insert({ user_id: currentUser.id, name });

      if (error) throw error;

      categoryNameInput.value = "";
      await loadCategories();
    } catch (err) {
      console.error("addCategory error", err);
      alert("カテゴリ追加に失敗しました。");
    }
  }

  async function deleteCategory(id) {
    if (!currentUser) return;
    if (!confirm("このカテゴリを削除しますか？（紐づく明細は残ります）")) return;

    try {
      const { error } = await supabase
        .from("categories")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) throw error;

      await loadCategories();
    } catch (err) {
      console.error("deleteCategory error", err);
      alert("カテゴリ削除に失敗しました。");
    }
  }

  /* ============================
     明細読み込み / 登録 / 削除
  ============================ */
  async function loadTransactions() {
    if (!currentUser) return;

    try {
      const { data, error } = await supabase
        .from("transactions")
        .select("id, date, category_name, memo, amount, type")
        .eq("user_id", currentUser.id)
        .order("date", { ascending: true })
        .order("id", { ascending: true });

      if (error) throw error;

      renderList(data);
    } catch (err) {
      console.error("loadTransactions error", err);
    }
  }

  async function addTransaction() {
    if (!currentUser) {
      alert("先にログインしてください。");
      return;
    }

    const date = dateInput.value;
    const categoryId = categorySelect.value;
    const memo = memoInput.value.trim();
    const amount = Number(amountInput.value);
    const type = document.querySelector('input[name="type"]:checked').value;

    if (!date || !categoryId || !amount) {
      alert("日付・カテゴリ・金額は必須です。");
      return;
    }

    const catOption = categorySelect.options[categorySelect.selectedIndex];
    const categoryName = catOption ? catOption.textContent : "";

    try {
      const { error } = await supabase
        .from("transactions")
        .insert({
          user_id: currentUser.id,
          date,
          category_id: categoryId,
          category_name: categoryName,
          memo,
          amount,
          type
        });

      if (error) throw error;

      clearInput(false);
      await loadTransactions();
      await renderSummary();
    } catch (err) {
      console.error("addTransaction error", err);
      alert("登録に失敗しました。");
    }
  }

async function deleteTransaction(id) {
    if (!currentUser) return;
    if (!confirm("この明細を削除しますか？")) return;

    try {
      const { error } = await supabase
        .from("transactions")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

      if (error) throw error;

      await loadTransactions();
      await renderSummary();
    } catch (err) {
      console.error("deleteTransaction error", err);
      alert("削除に失敗しました。");
    }
  }
</script>
