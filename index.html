<!-- Part1 -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>極密アプリ Ultimate Secure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--bg:#020617;--panel:#0f172a;--border:#1f2937;--accent:#38bdf8;--text:#e5e7eb;--sub:#9ca3af;--income:#4ade80;--expense:#f97373}
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#0f172a 0,#020617 55%,#000 100%);color:var(--text)}
    h1{margin:8px 0 16px;font-size:20px;letter-spacing:.08em}
    .wrap{max-width:1100px;margin:0 auto}
    .auth-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
    .panel{background:linear-gradient(135deg,rgba(15,23,42,.98),rgba(15,23,42,.9));border:1px solid rgba(148,163,184,.35);border-radius:10px;padding:12px;box-shadow:0 18px 40px rgba(15,23,42,.9);backdrop-filter:blur(10px)}
    .panel-title{font-size:13px;margin-bottom:8px;color:var(--sub);letter-spacing:.08em}
    .auth-panel{flex:1 1 260px}
    .auth-panel input{width:100%;margin-bottom:6px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:#020617;color:var(--text);font-size:13px}
    .auth-panel button{width:100%;padding:6px 8px;border-radius:6px;border:1px solid rgba(148,163,184,.6);background:#020617;color:var(--text);font-size:13px;cursor:pointer}
    .auth-msg{margin-top:4px;font-size:12px;color:#f97373;min-height:16px}
    .app-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,.9fr);gap:12px}
    @media(max-width:960px){.app-grid{grid-template-columns:minmax(0,1fr)}}
    .field-row{display:flex;gap:6px;margin-bottom:6px}
    .field-row input,.field-row select{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:#020617;color:var(--text);font-size:13px}
    .btn-main{padding:6px 10px;border-radius:6px;border:1px solid var(--accent);background:rgba(56,189,248,.15);color:var(--text);cursor:pointer}
    .btn-sub{padding:5px 8px;border-radius:6px;border:1px solid rgba(148,163,184,.6);background:#020617;color:var(--sub);cursor:pointer}
    .list{max-height:420px;overflow-y:auto;font-size:12px}
    .list-item{display:grid;grid-template-columns:70px 1fr 80px 70px 60px;gap:4px;padding:4px 6px;border-bottom:1px solid rgba(31,41,55,.9);align-items:center}
    .list-item:nth-child(2n){background:rgba(15,23,42,.7)}
    .list-item-amount.income{color:var(--income)}
    .list-item-amount.expense{color:var(--expense)}
    .summary-row{display:flex;flex-direction:column;gap:4px;font-size:12px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:999px;border:1px solid rgba(148,163,184,.5);font-size:11px;color:var(--sub)}
    .badge-dot{width:6px;height:6px;border-radius:999px;background:var(--accent)}
    .logout-row{display:flex;justify-content:flex-end;margin-bottom:8px}
    .hidden{display:none!important}
  </style>
</head>
<!-- Part2 -->
<body>
  <div class="wrap">
    <h1>極密アプリ Ultimate Secure</h1>

    <div class="auth-row">
      <div class="panel auth-panel">
        <div class="panel-title">新規登録</div>
        <input id="signupEmail" type="email" placeholder="新規登録メールアドレス" autocomplete="email">
        <input id="signupPassword" type="password" placeholder="新規登録パスワード（12文字以上推奨）" autocomplete="new-password">
        <input id="signupPasswordConfirm" type="password" placeholder="パスワード確認" autocomplete="new-password">
        <button id="signupBtn" onclick="signup()">新規登録</button>
        <div id="signupMsg" class="auth-msg" aria-live="polite"></div>
      </div>

      <div class="panel auth-panel">
        <div class="panel-title">ログイン</div>
        <input id="loginEmail" type="email" placeholder="メールアドレス" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="パスワード" autocomplete="current-password">
        <button id="loginBtn" onclick="login()">ログイン</button>
        <div id="loginMsg" class="auth-msg" aria-live="polite"></div>
      </div>
    </div>

    <div id="appArea" class="hidden" aria-hidden="true">
      <div class="logout-row">
        <span class="badge" id="loginUserLabel" role="status" aria-live="polite">
          <span class="badge-dot" aria-hidden="true"></span>
          <span id="loginUserEmail">ログイン中</span>
        </span>
        <button id="logoutBtn" class="btn-sub" style="margin-left:8px;" onclick="logout()">ログアウト</button>
      </div>

      <div class="app-grid">
        <div class="panel">
          <div class="panel-title">入力</div>
          <div class="field-row">
            <input id="dateInput" type="date" aria-label="日付">
            <select id="categorySelect" aria-label="カテゴリ"></select>
          </div>
          <div class="field-row">
            <input id="memoInput" type="text" placeholder="メモ" aria-label="メモ">
          </div>
          <div class="field-row">
            <input id="amountInput" type="number" placeholder="金額" aria-label="金額" min="0" step="1">
            <label><input type="radio" name="type" value="expense" checked> 支出</label>
            <label><input type="radio" name="type" value="income"> 収入</label>
          </div>
          <div class="field-row">
            <button class="btn-main" onclick="addTransaction()">登録</button>
            <button class="btn-sub" onclick="clearInput()">クリア</button>
          </div>

          <hr style="border:none;border-top:1px solid rgba(31,41,55,0.9);margin:10px 0;">
          <div class="panel-title">カテゴリ</div>
          <div class="field-row">
            <input id="categoryNameInput" type="text" placeholder="カテゴリ名（例：食費）" aria-label="カテゴリ名">
            <button class="btn-sub" onclick="addCategory()">追加</button>
          </div>
          <div id="categoryList" style="font-size:12px;color:var(--sub);max-height:120px;overflow-y:auto;"></div>
        </div>

        <div class="panel">
          <div class="panel-title">一覧</div>
          <div class="list" id="listArea" role="list"></div>
        </div>

        <div class="panel">
          <div class="panel-title">集計</div>
          <div class="summary-row" id="summaryArea" aria-live="polite">
            <span><strong>収入合計</strong><span id="sumIncome">0</span></span>
            <span><strong>支出合計</strong><span id="sumExpense">0</span></span>
            <span><strong>差引</strong><span id="sumNet">0</span></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<!-- Part3 -->
<script>
  const supabaseUrl = "https://dgkltvgjhjvhodleawuq.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRna2x0dmdqaGp2aG9kbGVhd3VxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDgxNDksImV4cCI6MjA5NTg4NDE0OX0._kS7sxV0Isqhr78mQW6VxR1Nc34AhHa2prb2OtlsuE8";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const signupEmail = document.getElementById("signupEmail");
  const signupPassword = document.getElementById("signupPassword");
  const signupPasswordConfirm = document.getElementById("signupPasswordConfirm");
  const signupMsg = document.getElementById("signupMsg");

  const loginEmail = document.getElementById("loginEmail");
  const loginPassword = document.getElementById("loginPassword");
  const loginMsg = document.getElementById("loginMsg");

  const appArea = document.getElementById("appArea");
  const loginUserEmail = document.getElementById("loginUserEmail");

  const dateInput = document.getElementById("dateInput");
  const categorySelect = document.getElementById("categorySelect");
  const memoInput = document.getElementById("memoInput");
  const amountInput = document.getElementById("amountInput");

  const categoryNameInput = document.getElementById("categoryNameInput");
  const categoryList = document.getElementById("categoryList");

  const listArea = document.getElementById("listArea");
  const sumIncome = document.getElementById("sumIncome");
  const sumExpense = document.getElementById("sumExpense");
  const sumNet = document.getElementById("sumNet");

  let currentUser = null;
</script>
<!-- Part4 -->
<script>
  function validatePasswordClient(pw, confirm) {
    const minLen = 12;
    if (!pw || pw.length < minLen) return { ok:false, msg:`パスワードは最低 ${minLen} 文字必要です` };
    if (pw !== confirm) return { ok:false, msg:"パスワード確認が一致しません" };
    return { ok:true };
  }

  async function signup() {
    signupMsg.textContent = "";
    const email = signupEmail.value.trim();
    const password = signupPassword.value;
    const confirm = signupPasswordConfirm.value;
    const v = validatePasswordClient(password, confirm);
    if (!v.ok) { signupMsg.textContent = v.msg; return; }
    try {
      const res = await supabase.auth.signUp({ email, password });
      console.log("signUp response", res);
      if (res.error) throw res.error;
      signupMsg.textContent = "確認メールを送信しました。メールを確認してください。";
      signupEmail.value = ""; signupPassword.value = ""; signupPasswordConfirm.value = "";
    } catch (err) {
      console.error("signup error", err);
      signupMsg.textContent = "新規登録に失敗しました：" + (err.message || JSON.stringify(err));
    }
  }

  async function login() {
    loginMsg.textContent = "";
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if (!email || !password) { loginMsg.textContent = "メールアドレスとパスワードを入力してください。"; return; }
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      currentUser = data.user;
      loginUserEmail.textContent = currentUser.email || "ログイン中";
      appArea.classList.remove("hidden"); appArea.setAttribute("aria-hidden","false");
      if (!dateInput.value) {
        const t = new Date(); dateInput.value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
      }
      await loadCategories(); await loadTransactions(); await renderSummary();
    } catch (err) {
      console.error("login error", err);
      loginMsg.textContent = "ログインに失敗しました：" + (err.message || JSON.stringify(err));
    }
  }

  async function logout() {
    try { await supabase.auth.signOut(); } catch(e){ console.warn("signOut error", e); }
    currentUser = null;
    appArea.classList.add("hidden"); appArea.setAttribute("aria-hidden","true");
    loginUserEmail.textContent = "ログイン中";
    listArea.innerHTML = ""; sumIncome.textContent = "0"; sumExpense.textContent = "0"; sumNet.textContent = "0";
  }

  (async () => {
    try {
      const { data } = await supabase.auth.getSession();
      if (data && data.session && data.session.user) {
        currentUser = data.session.user;
        loginUserEmail.textContent = currentUser.email || "ログイン中";
        appArea.classList.remove("hidden"); appArea.setAttribute("aria-hidden","false");
        if (!dateInput.value) {
          const t = new Date(); dateInput.value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
        }
        await loadCategories(); await loadTransactions(); await renderSummary();
      }
    } catch (err) { console.error("session restore error", err); }
  })();

  async function loadCategories() {
    if (!currentUser) return;
    try {
      const { data, error } = await supabase.from("categories").select("*").eq("user_id", currentUser.id).order("name",{ascending:true});
      if (error) throw error;
      categorySelect.innerHTML = "";
      const opt = document.createElement("option"); opt.value=""; opt.textContent="カテゴリを選択"; categorySelect.appendChild(opt);
      categoryList.innerHTML = "";
      (data||[]).forEach(cat => {
        const o = document.createElement("option"); o.value = cat.id; o.textContent = cat.name; categorySelect.appendChild(o);
        const div = document.createElement("div"); div.style.display="flex"; div.style.justifyContent="space-between"; div.style.alignItems="center"; div.style.padding="2px 0";
        const span = document.createElement("span"); span.textContent = cat.name;
        const btn = document.createElement("button"); btn.textContent="削除"; btn.className="btn-sub"; btn.style.fontSize="11px"; btn.onclick = () => deleteCategory(cat.id);
        div.appendChild(span); div.appendChild(btn); categoryList.appendChild(div);
      });
    } catch (err) { console.error("loadCategories error", err); }
  }

  async function addCategory() {
    if (!currentUser) { alert("先にログインしてください。"); return; }
    const name = categoryNameInput.value.trim(); if (!name) return;
    try {
      const { error } = await supabase.from("categories").insert({ user_id: currentUser.id, name });
      if (error) throw error;
      categoryNameInput.value = ""; await loadCategories();
    } catch (err) { console.error("addCategory error", err); alert("カテゴリ追加に失敗しました。"); }
  }

  async function deleteCategory(id) {
    if (!currentUser) return; if (!confirm("このカテゴリを削除しますか？（紐づく明細は残ります）")) return;
    try {
      const { error } = await supabase.from("categories").delete().eq("id", id).eq("user_id", currentUser.id);
      if (error) throw error; await loadCategories();
    } catch (err) { console.error("deleteCategory error", err); alert("カテゴリ削除に失敗しました。"); }
  }

  async function loadTransactions() {
    if (!currentUser) return;
    try {
      const { data, error } = await supabase.from("transactions").select("id,date,category_name,memo,amount,type").eq("user_id", currentUser.id).order("date",{ascending:true}).order("id",{ascending:true});
      if (error) throw error;
      renderList(data || []);
    } catch (err) { console.error("loadTransactions error", err); }
  }

  async function addTransaction() {
    if (!currentUser) { alert("先にログインしてください。"); return; }
    const date = dateInput.value; const categoryId = categorySelect.value; const memo = memoInput.value.trim(); const amount = Number(amountInput.value); const type = document.querySelector('input[name="type"]:checked').value;
    if (!date || !categoryId || !amount) { alert("日付・カテゴリ・金額は必須です。"); return; }
    const catOption = categorySelect.options[categorySelect.selectedIndex]; const categoryName = catOption ? catOption.textContent : "";
    try {
      const { error } = await supabase.from("transactions").insert({ user_id: currentUser.id, date, category_id: categoryId, category_name: categoryName, memo, amount, type });
      if (error) throw error;
      clearInput(false); await loadTransactions(); await renderSummary();
    } catch (err) { console.error("addTransaction error", err); alert("登録に失敗しました。"); }
  }

  async function deleteTransaction(id) {
    if (!currentUser) return; if (!confirm("この明細を削除しますか？")) return;
    try {
      const { error } = await supabase.from("transactions").delete().eq("id", id).eq("user_id", currentUser.id);
      if (error) throw error; await loadTransactions(); await renderSummary();
    } catch (err) { console.error("deleteTransaction error", err); alert("削除に失敗しました。"); }
  }
</script>
<!-- Part5 -->
<script>
  function renderList(rows) {
    listArea.innerHTML = "";
    if (!rows || rows.length === 0) { listArea.textContent = "データがありません。"; return; }
    rows.forEach(r => {
      const div = document.createElement("div"); div.className = "list-item";
      const d = document.createElement("div"); d.textContent = r.date || "";
      const m = document.createElement("div"); m.textContent = r.memo || "";
      const c = document.createElement("div"); c.textContent = r.category_name || "";
      const a = document.createElement("div"); a.className = "list-item-amount " + (r.type === "income" ? "income" : "expense"); a.textContent = (r.type === "income" ? "+" : "-") + Number(r.amount || 0).toLocaleString();
      const btn = document.createElement("button"); btn.textContent = "削除"; btn.className = "btn-sub"; btn.style.fontSize = "11px"; btn.onclick = () => deleteTransaction(r.id);
      div.appendChild(d); div.appendChild(m); div.appendChild(c); div.appendChild(a); div.appendChild(btn);
      listArea.appendChild(div);
    });
  }

  async function renderSummary() {
    if (!currentUser) return;
    try {
      const { data, error } = await supabase.from("transactions").select("amount,type").eq("user_id", currentUser.id);
      if (error) throw error;
      let income = 0, expense = 0;
      (data || []).forEach(r => { const amt = Number(r.amount) || 0; if (r.type === "income") income += amt; else expense += amt; });
      sumIncome.textContent = income.toLocaleString(); sumExpense.textContent = expense.toLocaleString(); sumNet.textContent = (income - expense).toLocaleString();
    } catch (err) { console.error("renderSummary error", err); }
  }

  function clearInput(clearDate = false) {
    if (clearDate) dateInput.value = "";
    memoInput.value = "";
    amountInput.value = "";
  }
</script>
</body>
</html>
